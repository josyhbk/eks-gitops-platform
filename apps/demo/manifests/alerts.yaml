apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo
spec:
  groups:
    - name: demo
      rules:
        - alert: DemoHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="demo", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{namespace="demo"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of demo requests fail
            description: '{{ $value | humanizePercentage }} of requests returned 5xx over the last 5 minutes.'

        - alert: DemoSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="demo"}[5m]))) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Demo p95 latency is over 500ms
            description: 'p95 latency is {{ $value | humanizeDuration }}.'
