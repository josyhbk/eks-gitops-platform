# Picked up by the Grafana sidecar in platform/monitoring (label grafana_dashboard)
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-dashboard
  labels:
    grafana_dashboard: "1"
data:
  demo.json: |
    {
      "title": "Demo app",
      "uid": "demo-app",
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "schemaVersion": 39,
      "panels": [
        {
          "type": "timeseries", "title": "Requests per second by status",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [{"refId": "A", "legendFormat": "{{status}}",
            "expr": "sum by (status) (rate(http_requests_total{namespace=\"demo\"}[5m]))"}]
        },
        {
          "type": "timeseries", "title": "Latency p50 / p95",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"refId": "A", "legendFormat": "p50",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])))"},
            {"refId": "B", "legendFormat": "p95",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])))"}
          ]
        },
        {
          "type": "stat", "title": "Error rate (5xx)",
          "gridPos": {"x": 0, "y": 8, "w": 6, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute",
            "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.05}]}}},
          "targets": [{"refId": "A",
            "expr": "sum(rate(http_requests_total{namespace=\"demo\", status=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"demo\"}[5m])) or vector(0)"}]
        },
        {
          "type": "stat", "title": "Ready pods",
          "gridPos": {"x": 6, "y": 8, "w": 6, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A",
            "expr": "sum(kube_pod_status_ready{namespace=\"demo\", condition=\"true\"})"}]
        }
      ]
    }
